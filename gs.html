<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b0806" />
<title>Game Skill</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:wght@400;500&display=swap');
:root{
  --disp:'Cinzel','Trajan Pro',Georgia,serif;
  --body:'Spectral',Georgia,serif;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;}
body{
  font-family:var(--body);color:#cbb892;
  background:radial-gradient(120% 100% at 50% -10%, #241a12 0%, #140f0a 55%, #0b0806 100%);
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;
}
.wrap{
  width:100%;max-width:600px;padding:22px clamp(14px,3vw,26px) 20px;border-radius:10px;
  border:1px solid #2c2114;box-shadow:inset 0 0 60px rgba(0,0,0,.6);
  background:radial-gradient(120% 100% at 50% -10%, #1c140d 0%, #120d09 60%, #0b0806 100%);
}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.name{font-family:var(--disp);font-size:22px;font-weight:700;color:#e8d9a8;background:transparent;
  border:none;letter-spacing:.5px;width:160px;}
.name:focus{outline:none;}
.lvl{font-family:var(--disp);font-size:12px;color:#c9a227;white-space:nowrap;border:1px solid #6b5320;
  border-radius:20px;padding:2px 11px;letter-spacing:1px;}
.xpOuter{position:relative;flex:1;min-width:150px;height:20px;border-radius:4px;overflow:hidden;
  background:linear-gradient(#0a0705,#150f09);border:1px solid #3a2c18;}
.xpInner{height:100%;background:linear-gradient(90deg,#7a1414,#b62626,#e04a2a);
  box-shadow:0 0 12px rgba(224,74,42,.5);transition:width .4s ease;}
.xpTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;
  color:#f0e2bd;text-shadow:0 1px 3px #000;}
.stage{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.panel{position:relative;border-radius:6px;border:3px solid #1a1712;
  background:linear-gradient(150deg,#4a463f,#2f2b26 45%,#3a3630 100%);
  box-shadow:inset 0 0 40px rgba(0,0,0,.7), 0 0 0 1px #6a6154, 0 6px 20px rgba(0,0,0,.5);}
.noise{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5;border-radius:4px;}
.cell{position:absolute;width:64px;}
.node{position:relative;width:64px;height:64px;padding:3px;border-radius:6px;border:1px solid #14110c;
  background:linear-gradient(145deg,#8b8375 0%,#5f594e 40%,#3b372f 100%);cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 4px rgba(0,0,0,.6), 0 2px 4px rgba(0,0,0,.5);
  transition:box-shadow .18s ease, transform .08s ease;}
.node:active{transform:scale(.96);}
.node.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 0 16px rgba(224,180,60,.5), 0 0 0 1px #b8912e;}
.node.max{box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 0 20px rgba(242,214,117,.7), 0 0 0 2px #e6cb45;}
.inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:4px;
  background:radial-gradient(120% 120% at 30% 25%, #2b2822 0%, #17140f 100%);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.8);}
.inner svg{width:26px;height:26px;}
.glyph{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1;text-shadow:0 1px 3px #000;}
.badge{position:absolute;bottom:-7px;right:-7px;min-width:24px;height:22px;padding:0 5px;border-radius:4px;
  background:linear-gradient(#2a2115,#120d07);border:1px solid #b8912e;color:#f2d675;font-family:var(--disp);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #000;}
.minus{position:absolute;top:-8px;left:-8px;width:20px;height:20px;border-radius:50%;border:1px solid #5a4a2a;
  background:#241a10;color:#c9a227;font-family:var(--disp);font-size:15px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #000;}
.minus:active{transform:scale(.9);}
.prog{height:16px;margin-top:12px;display:flex;align-items:center;justify-content:center;}
.pips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:70px;}
.pip{width:5px;height:5px;border-radius:1px;background:#1a160f;border:1px solid #4a4236;}
.pip.on{background:#e6cb45;border:1px solid #b8912e;box-shadow:0 0 4px rgba(230,203,69,.8);}
.maxTxt{font-family:var(--disp);font-size:11px;letter-spacing:1px;color:#f2d675;text-shadow:0 1px 2px #000;}
.one{font-family:var(--body);font-size:10px;color:#8a7a52;}
.treeName{position:absolute;left:12px;bottom:8px;font-family:var(--disp);font-size:12px;letter-spacing:2px;
  text-transform:uppercase;color:#d8cbaa;text-shadow:0 1px 3px #000;opacity:.85;}
.clear{position:absolute;right:10px;bottom:8px;width:40px;height:40px;border-radius:5px;border:1px solid #14110c;
  color:#d8cbaa;background:linear-gradient(145deg,#7a7266,#3b372f);cursor:pointer;display:flex;align-items:center;
  justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 2px 4px rgba(0,0,0,.5);}
.clear:active{transform:scale(.95);}
.tabs{display:flex;flex-direction:column;gap:8px;width:116px;}
.plate{font-family:var(--disp);font-weight:700;font-size:15px;color:#d8c690;letter-spacing:1px;text-align:center;
  padding:16px 6px;border-radius:6px;border:1px solid #5a5142;text-shadow:0 1px 3px #000;
  background:linear-gradient(150deg,#3a352d,#211d17);box-shadow:inset 0 1px 0 rgba(255,255,255,.15), inset 0 0 20px rgba(0,0,0,.6);}
.tab{font-family:var(--disp);font-size:13px;letter-spacing:1px;color:#f2d675;padding:12px 8px;border-radius:6px;
  text-align:center;border:1px solid #b8912e;background:linear-gradient(150deg,#3c3320,#241c0f);
  box-shadow:inset 0 0 18px rgba(201,162,39,.18), 0 0 12px rgba(201,162,39,.25);}
.resetBtn{font-family:var(--disp);font-size:11px;letter-spacing:1px;color:#9c9488;padding:11px 8px;border-radius:6px;
  text-align:center;border:1px solid #3f382d;cursor:pointer;background:linear-gradient(150deg,#2b2820,#181510);
  box-shadow:inset 0 0 16px rgba(0,0,0,.6);}
.resetBtn:active{transform:scale(.97);}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12);box-shadow:0 0 26px rgba(242,214,117,.9)}100%{transform:scale(1)}}
.node.pulse{animation:pop .38s ease;}
@media (prefers-reduced-motion:reduce){.node,.xpInner{transition:none}.node.pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <input id="name" class="name" spellcheck="false" />
    <span id="lvl" class="lvl">Level 0</span>
    <div class="xpOuter"><div id="xp" class="xpInner"></div><span id="xptxt" class="xpTxt">0 / 99</span></div>
  </div>
  <div class="stage">
    <div id="panel" class="panel">
      <svg class="noise"><defs><filter id="rock">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="matrix" values="0 0 0 0 0.32  0 0 0 0 0.30  0 0 0 0 0.27  0 0 0 0.6 0"/>
      </filter></defs><rect width="100%" height="100%" filter="url(#rock)"/></svg>
    </div>
    <div class="tabs">
      <div class="plate">Game Skill</div>
      <div class="tab">Game</div>
      <div style="flex:1"></div>
      <button id="reset" class="resetBtn">&#8635; Reset</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "game-skill-html-v1";
  var MAX = 99;
  var NODE = 64, GAP = 30, PADX = 28, ROWY = 52;
  var PANEL_W = PADX*2 + 4*NODE + 3*GAP;   // 402
  var PANEL_H = 184;

  var DROPLET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>';

  var SQUARES = [
    { id:"water", kind:"icon",   label:"Drink Water", escalating:true  },
    { id:"I",     kind:"letter", letter:"I", label:"Skill I", escalating:true  },
    { id:"D",     kind:"letter", letter:"D", label:"Skill D", escalating:false },
    { id:"S",     kind:"letter", letter:"S", label:"Skill S", escalating:false }
  ];

  function freshSkills(){
    var o = {};
    SQUARES.forEach(function(s){ o[s.id] = { level:0, progress:0, clicks:0 }; });
    return o;
  }
  var state = load();

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && p.skills) return { name: p.name || "Wanderer", skills: p.skills };
      }
    }catch(e){}
    return { name:"Wanderer", skills:freshSkills() };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  function def(id){ for(var i=0;i<SQUARES.length;i++) if(SQUARES[i].id===id) return SQUARES[i]; }
  function overall(){ var t=0; SQUARES.forEach(function(s){ t += state.skills[s.id].level; }); return t; }
  function clicksNeeded(ov, esc){
    if(ov >= MAX) return 0;
    if(!esc) return 1;
    return ov < 20 ? 1 : Math.floor(ov/10);
  }

  function click(id){
    if(overall() >= MAX) return;
    var d = def(id), s = state.skills[id];
    var need = clicksNeeded(overall(), d.escalating);
    s.clicks += 1; s.progress += 1;
    var leveled = false;
    if(s.progress >= need){ s.level += 1; s.progress = 0; leveled = true; }
    save(); render();
    if(leveled) pulse(id);
  }
  function undo(id){
    var d = def(id), s = state.skills[id];
    if(s.clicks <= 0) return;
    s.clicks -= 1;
    if(s.progress > 0){ s.progress -= 1; }
    else if(s.level > 0){ s.level -= 1; s.progress = Math.max(0, clicksNeeded(overall(), d.escalating) - 1); }
    save(); render();
  }
  function reset(){ state.skills = freshSkills(); save(); render(); }

  function pulse(id){
    var n = document.querySelector('.node[data-id="'+id+'"]');
    if(!n) return;
    n.classList.add('pulse');
    setTimeout(function(){ n.classList.remove('pulse'); }, 380);
  }

  // ---- build ----
  var panel = document.getElementById("panel");
  var nameInput = document.getElementById("name");
  panel.style.width = PANEL_W + "px";
  panel.style.height = PANEL_H + "px";

  var cells = {};
  SQUARES.forEach(function(sq, i){
    var cell = document.createElement("div");
    cell.className = "cell";
    cell.style.left = (PADX + i*(NODE+GAP)) + "px";
    cell.style.top = ROWY + "px";

    var node = document.createElement("button");
    node.className = "node";
    node.setAttribute("data-id", sq.id);

    var inner = document.createElement("span");
    inner.className = "inner";
    if(sq.kind === "icon"){ inner.innerHTML = DROPLET; }
    else { var g = document.createElement("span"); g.className = "glyph"; g.textContent = sq.letter; inner.appendChild(g); }

    var badge = document.createElement("span"); badge.className = "badge";

    node.appendChild(inner);
    node.appendChild(badge);
    cell.appendChild(node);

    var prog = document.createElement("div"); prog.className = "prog";
    cell.appendChild(prog);

    panel.appendChild(cell);

    node.addEventListener("click", function(){ click(sq.id); });
    node.addEventListener("contextmenu", function(e){ e.preventDefault(); undo(sq.id); });

    cells[sq.id] = { node:node, inner:inner, badge:badge, prog:prog };
  });

  nameInput.addEventListener("input", function(){ state.name = nameInput.value; save(); });
  document.getElementById("reset").addEventListener("click", reset);

  function render(){
    var ov = overall();
    var maxed = ov >= MAX;
    nameInput.value = state.name;
    document.getElementById("lvl").textContent = "Level " + ov;
    document.getElementById("xp").style.width = (ov / MAX * 100) + "%";
    document.getElementById("xptxt").textContent = ov + " / " + MAX;

    SQUARES.forEach(function(sq){
      var s = state.skills[sq.id];
      var c = cells[sq.id];
      var on = s.clicks > 0;
      c.node.className = "node" + (maxed ? " max" : on ? " on" : "");
      c.badge.textContent = s.clicks;
      // icon / letter colour
      var col = on ? "#f2d675" : (sq.kind === "icon" ? "#b9b1a0" : "#d8cbaa");
      var svg = c.inner.querySelector("svg"); if(svg) svg.style.color = col;
      var gl = c.inner.querySelector(".glyph"); if(gl) gl.style.color = col;

      var need = clicksNeeded(ov, sq.escalating);
      if(maxed){ c.prog.innerHTML = '<span class="maxTxt">MAX</span>'; }
      else if(need > 1){
        var html = '<div class="pips">';
        for(var k=0;k<need;k++){ html += '<span class="pip'+(k < s.progress ? ' on':'')+'"></span>'; }
        html += '</div>';
        c.prog.innerHTML = html;
      } else {
        c.prog.innerHTML = '<span class="one">1 / level</span>';
      }
    });
  }

  render();
})();
</script>
</body>
</html>
