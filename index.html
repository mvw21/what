<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b0806" />
<title>Game Skill</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:wght@400;500&display=swap');
:root{ --disp:'Cinzel','Trajan Pro',Georgia,serif; --body:'Spectral',Georgia,serif; }
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;}
body{
  font-family:var(--body);color:#cbb892;
  background:radial-gradient(120% 100% at 50% -10%, #241a12 0%, #140f0a 55%, #0b0806 100%);
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;
}
.wrap{
  width:100%;max-width:560px;padding:20px clamp(12px,3vw,22px);border-radius:10px;
  border:1px solid #2c2114;box-shadow:inset 0 0 60px rgba(0,0,0,.6);
  background:radial-gradient(120% 100% at 50% -10%, #1c140d 0%, #120d09 60%, #0b0806 100%);
}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.name{font-family:var(--disp);font-size:22px;font-weight:700;color:#e8d9a8;background:transparent;border:none;letter-spacing:.5px;width:150px;}
.name:focus{outline:none;}
.lvl{font-family:var(--disp);font-size:12px;color:#c9a227;white-space:nowrap;border:1px solid #6b5320;border-radius:20px;padding:2px 11px;letter-spacing:1px;}
.xpOuter{position:relative;flex:1;min-width:140px;height:20px;border-radius:4px;overflow:hidden;background:linear-gradient(#0a0705,#150f09);border:1px solid #3a2c18;}
.xpInner{height:100%;background:linear-gradient(90deg,#7a1414,#b62626,#e04a2a);box-shadow:0 0 12px rgba(224,74,42,.5);transition:width .4s ease;}
.xpTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#f0e2bd;text-shadow:0 1px 3px #000;}
.stage{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.panel{position:relative;border-radius:6px;border:3px solid #1a1712;
  background:linear-gradient(150deg,#4a463f,#2f2b26 45%,#3a3630 100%);
  box-shadow:inset 0 0 40px rgba(0,0,0,.7), 0 0 0 1px #6a6154, 0 6px 20px rgba(0,0,0,.5);
  display:grid;grid-template-columns:repeat(2,64px);justify-content:center;gap:24px 30px;padding:24px;}
.noise{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5;border-radius:4px;}
.cell{width:64px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;}
.node{position:relative;width:64px;height:64px;padding:3px;border-radius:6px;border:1px solid #14110c;
  background:linear-gradient(145deg,#8b8375 0%,#5f594e 40%,#3b372f 100%);cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 4px rgba(0,0,0,.6), 0 2px 4px rgba(0,0,0,.5);
  transition:box-shadow .18s ease, transform .08s ease;}
.node:active{transform:scale(.96);}
.node.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 0 16px rgba(224,180,60,.5), 0 0 0 1px #b8912e;}
.node.max{box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 0 20px rgba(242,214,117,.7), 0 0 0 2px #e6cb45;}
.inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:4px;
  background:radial-gradient(120% 120% at 30% 25%, #2b2822 0%, #17140f 100%);box-shadow:inset 0 2px 6px rgba(0,0,0,.8);}
.inner svg{width:26px;height:26px;}
.glyph{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1;text-shadow:0 1px 3px #000;}
.badge{position:absolute;bottom:-7px;right:-7px;min-width:24px;height:22px;padding:0 5px;border-radius:4px;
  background:linear-gradient(#2a2115,#120d07);border:1px solid #b8912e;color:#f2d675;font-family:var(--disp);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #000;}
.prog{height:16px;margin-top:11px;display:flex;align-items:center;justify-content:center;}
.pips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:64px;}
.pip{width:5px;height:5px;border-radius:1px;background:#1a160f;border:1px solid #4a4236;}
.pip.on{background:#e6cb45;border:1px solid #b8912e;box-shadow:0 0 4px rgba(230,203,69,.8);}
.count{font-family:var(--disp);font-size:11px;letter-spacing:.5px;color:#e6cb45;text-shadow:0 1px 2px #000;}
.maxTxt{font-family:var(--disp);font-size:11px;letter-spacing:1px;color:#f2d675;text-shadow:0 1px 2px #000;}
.one{font-family:var(--body);font-size:10px;color:#8a7a52;}
.tabs{display:flex;flex-direction:column;gap:8px;width:116px;}
.plate{font-family:var(--disp);font-weight:700;font-size:15px;color:#d8c690;letter-spacing:1px;text-align:center;
  padding:16px 6px;border-radius:6px;border:1px solid #5a5142;text-shadow:0 1px 3px #000;
  background:linear-gradient(150deg,#3a352d,#211d17);box-shadow:inset 0 1px 0 rgba(255,255,255,.15), inset 0 0 20px rgba(0,0,0,.6);}
.tab{font-family:var(--disp);font-size:13px;letter-spacing:1px;color:#f2d675;padding:12px 8px;border-radius:6px;text-align:center;
  border:1px solid #b8912e;background:linear-gradient(150deg,#3c3320,#241c0f);box-shadow:inset 0 0 18px rgba(201,162,39,.18), 0 0 12px rgba(201,162,39,.25);}
.resetBtn{font-family:var(--disp);font-size:11px;letter-spacing:1px;color:#9c9488;padding:11px 8px;border-radius:6px;text-align:center;
  border:1px solid #3f382d;cursor:pointer;background:linear-gradient(150deg,#2b2820,#181510);box-shadow:inset 0 0 16px rgba(0,0,0,.6);}
.resetBtn:active{transform:scale(.97);}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12);box-shadow:0 0 26px rgba(242,214,117,.9)}100%{transform:scale(1)}}
.node.pulse{animation:pop .38s ease;}
@media (prefers-reduced-motion:reduce){.node,.xpInner{transition:none}.node.pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <input id="name" class="name" spellcheck="false" />
    <span id="lvl" class="lvl">Level 0</span>
    <div class="xpOuter"><div id="xp" class="xpInner"></div><span id="xptxt" class="xpTxt">0 / 99</span></div>
  </div>
  <div class="stage">
    <div id="panel" class="panel">
      <svg class="noise"><defs><filter id="rock">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="matrix" values="0 0 0 0 0.32  0 0 0 0 0.30  0 0 0 0 0.27  0 0 0 0.6 0"/>
      </filter></defs><rect width="100%" height="100%" filter="url(#rock)"/></svg>
    </div>
    <div class="tabs">
      <div class="plate">Game Skill</div>
      <div class="tab">Game</div>
      <div style="flex:1"></div>
      <button id="reset" class="resetBtn">&#8635; Reset</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "game-skill-html-v1";
  var MAX = 99;

  var ICONS = {
    droplet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
    dumbbell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8 v8"/><path d="M7 6.5 v11"/><path d="M7 12 h10"/><path d="M17 6.5 v11"/><path d="M20 8 v8"/></svg>'
  };

  // mode: "escalate" -> based on overall level (1 up to 20, then 2 in the 20s, 3 in the 30s ...)
  //       "one"      -> 1 click per level
  //       "fixed"    -> always `fixed` clicks per level
  var SQUARES = [
    { id:"walks", kind:"letter", letter:"W",     label:"Walks",       mode:"fixed", fixed:20 },
    { id:"water", kind:"icon",   icon:"droplet", label:"Drink Water", mode:"escalate" },
    { id:"I",     kind:"letter", letter:"I",     label:"Skill I",     mode:"escalate" },
    { id:"D",     kind:"letter", letter:"D",     label:"Skill D",     mode:"one" },
    { id:"S",     kind:"letter", letter:"S",     label:"Skill S",     mode:"one" },
    { id:"big1",  kind:"letter", letter:"B",     label:"Skill B",     mode:"one" },
    { id:"abs",   kind:"icon",   icon:"dumbbell",label:"Dumbbell",    mode:"one" },
    { id:"N",     kind:"letter", letter:"N",     label:"Skill N",     mode:"one" }
  ];

  function freshSkills(){
    var o = {};
    SQUARES.forEach(function(s){ o[s.id] = { level:0, progress:0, clicks:0 }; });
    return o;
  }
  function load(){
    var base = freshSkills();
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && p.skills){
          SQUARES.forEach(function(s){
            var old = p.skills[s.id];
            if(old) base[s.id] = { level:old.level||0, progress:old.progress||0, clicks:old.clicks||0 };
          });
          return { name: p.name || "Wanderer", skills: base };
        }
      }
    }catch(e){}
    return { name:"Wanderer", skills:base };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  var state = load();

  function def(id){ for(var i=0;i<SQUARES.length;i++) if(SQUARES[i].id===id) return SQUARES[i]; }
  function overall(){ var t=0; SQUARES.forEach(function(s){ t += state.skills[s.id].level; }); return t; }
  function clicksNeeded(ov, sq){
    if(ov >= MAX) return 0;
    if(sq.mode === "one")   return 1;
    if(sq.mode === "fixed") return sq.fixed;
    return ov < 20 ? 1 : Math.floor(ov/10);   // escalate
  }

  function click(id){
    if(overall() >= MAX) return;
    var sq = def(id), s = state.skills[id];
    var need = clicksNeeded(overall(), sq);
    s.clicks += 1; s.progress += 1;
    var leveled = false;
    if(s.progress >= need){ s.level += 1; s.progress = 0; leveled = true; }
    save(); render();
    if(leveled) pulse(id);
  }
  function undo(id){
    var sq = def(id), s = state.skills[id];
    if(s.clicks <= 0) return;
    s.clicks -= 1;
    if(s.progress > 0){ s.progress -= 1; }
    else if(s.level > 0){ s.level -= 1; s.progress = Math.max(0, clicksNeeded(overall(), sq) - 1); }
    save(); render();
  }
  function reset(){ state.skills = freshSkills(); save(); render(); }
  function pulse(id){
    var n = document.querySelector('.node[data-id="'+id+'"]');
    if(!n) return; n.classList.add('pulse');
    setTimeout(function(){ n.classList.remove('pulse'); }, 380);
  }

  // ---- build ----
  var panel = document.getElementById("panel");
  var nameInput = document.getElementById("name");
  var cells = {};

  SQUARES.forEach(function(sq){
    var cell = document.createElement("div"); cell.className = "cell";

    var node = document.createElement("button"); node.className = "node"; node.setAttribute("data-id", sq.id);
    var inner = document.createElement("span"); inner.className = "inner";
    if(sq.kind === "icon"){ inner.innerHTML = ICONS[sq.icon]; }
    else {
      var g = document.createElement("span"); g.className = "glyph"; g.textContent = sq.letter;
      var L = sq.letter.length;
      g.style.fontSize = (L <= 1 ? 30 : L === 2 ? 22 : L === 3 ? 18 : 15) + "px";
      inner.appendChild(g);
    }
    var badge = document.createElement("span"); badge.className = "badge";
    node.appendChild(inner); node.appendChild(badge);

    var prog = document.createElement("div"); prog.className = "prog";

    cell.appendChild(node); cell.appendChild(prog);
    panel.appendChild(cell);

    node.addEventListener("click", function(){ click(sq.id); });
    node.addEventListener("contextmenu", function(e){ e.preventDefault(); undo(sq.id); });

    cells[sq.id] = { node:node, inner:inner, badge:badge, prog:prog };
  });

  nameInput.addEventListener("input", function(){ state.name = nameInput.value; save(); });
  document.getElementById("reset").addEventListener("click", reset);

  function render(){
    var ov = overall();
    var maxed = ov >= MAX;
    nameInput.value = state.name;
    document.getElementById("lvl").textContent = "Level " + ov;
    document.getElementById("xp").style.width = (ov / MAX * 100) + "%";
    document.getElementById("xptxt").textContent = ov + " / " + MAX;

    SQUARES.forEach(function(sq){
      var s = state.skills[sq.id], c = cells[sq.id];
      var on = s.clicks > 0;
      c.node.className = "node" + (maxed ? " max" : on ? " on" : "");
      c.badge.textContent = s.clicks;
      var col = on ? "#f2d675" : (sq.kind === "icon" ? "#b9b1a0" : "#d8cbaa");
      var svg = c.inner.querySelector("svg"); if(svg) svg.style.color = col;
      var gl = c.inner.querySelector(".glyph"); if(gl) gl.style.color = col;

      var need = clicksNeeded(ov, sq);
      if(maxed){ c.prog.innerHTML = '<span class="maxTxt">MAX</span>'; }
      else if(need <= 1){ c.prog.innerHTML = '<span class="one">1 / level</span>'; }
      else if(need <= 10){
        var html = '<div class="pips">';
        for(var k=0;k<need;k++){ html += '<span class="pip'+(k < s.progress ? ' on':'')+'"></span>'; }
        html += '</div>';
        c.prog.innerHTML = html;
      } else {
        c.prog.innerHTML = '<span class="count">'+ s.progress +' / '+ need +'</span>';
      }
    });
  }

  render();
})();
</script>
</body>
</html>
